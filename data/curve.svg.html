<figcaption class="curve__cap">
  <p>曲線由 Debye 積分（p.113 式 30）<strong>實際取樣 141 點</strong>繪出，不是示意圖。低溫端數值積分得 C/3R = 0.0097，與 T³ 律解析值 (12π⁴/5)(T/θ)³/3 = 0.00974 相符；高溫漸近線 3R = 24.943 J·mol⁻¹·K⁻¹ 與書中 Fig. 7 標示的數值一致。</p>
  <p>陰影區為書中 p.113 明言的 T³ 律適用範圍（<strong>0.1θ 以下</strong>，不是「T &lt; θ」）。下方三帶對應 11 個主題的發生溫區；另有兩個主題不隨溫度定位（基礎與定義層），列於帶外。</p>
</figcaption>
